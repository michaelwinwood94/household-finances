<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f4e46">
  <title>Household Finances</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=202611230030">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">$</span> Household Finances</div>
    <div class="topbar-right"><div id="whoswitch" class="seg whoseg hidden" role="group" aria-label="Whose figures to show"></div>
    <button id="signout" class="link hidden" type="button">Sign out</button></div>
  </header>

  <nav id="tabs" class="tabs hidden" aria-label="Sections">
    <div class="tabs-main">
      <button data-view="dashboard" class="active">Home</button>
      <button data-view="budget">Budget</button>
      <button data-view="bills">Bills</button>
      <button data-view="income">Income</button>
      <button data-view="debts">Debts</button>
      <button data-view="transactions">Transactions</button>
      <button data-view="sort">To sort <span id="sort-badge" class="badge hidden"></span></button>
    </div>
    <div class="tabs-more">
      <button data-view="import">Import</button>
      <button data-view="shared">Shared</button>
      <button data-view="pay">Payslips</button>
      <button data-view="tax">Tax</button>
      <button data-view="setup">Setup</button>
    </div>
  </nav>

  <main id="main">
    <section id="auth" class="card narrow">
      <h2>Sign in</h2>
      <form id="authform">
        <label>Email <input type="email" id="email" required autocomplete="email"></label>
        <label>Password <input type="password" id="password" required minlength="8" autocomplete="current-password"></label>
        <div class="row">
          <button type="submit" class="primary">Sign in</button>
          <button type="button" id="signup">Create account</button>
        </div>
        <p id="authmsg" class="msg" role="status"></p>
      </form>
    </section>
    <div id="view"></div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js?v=202611230030"></script>
</body>
</html>
